<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha de Doente — NF-IPO Lisboa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="/static/css/style.css" rel="stylesheet" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="fa-solid fa-dna me-2"></i>Sistema NF-IPO Lisboa
    </a>
    <div class="ms-auto">
      <a href="/" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i>Dashboard
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-4">

  <!-- Patient Header -->
  <div class="card border-0 shadow-sm mb-4" id="patientHeader">
    <div class="card-body">
      <div class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
    </div>
  </div>

  <div class="row g-4">

    <!-- Left: Timeline -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-semibold"><i class="fa-solid fa-timeline text-primary me-2"></i>Linha Cronológica</h6>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary" onclick="openModal('modalConsulta')">
              <i class="fa-solid fa-stethoscope me-1"></i>Consulta
            </button>
            <button class="btn btn-outline-success" onclick="openModal('modalExame')">
              <i class="fa-solid fa-microscope me-1"></i>Exame
            </button>
            <button class="btn btn-outline-purple" onclick="openModal('modalGmnf')">
              <i class="fa-solid fa-users me-1"></i>GMNF
            </button>
            <button class="btn btn-outline-warning" onclick="openModal('modalTerapia')">
              <i class="fa-solid fa-pills me-1"></i>Terapia
            </button>
          </div>
        </div>
        <div class="card-body">
          <div id="timelineContainer">
            <div class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>A carregar linha cronológica…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Info + Alerts -->
    <div class="col-lg-4">

      <!-- Consent status -->
      <div class="card border-0 shadow-sm mb-3" id="consentCard">
        <div class="card-header bg-white border-bottom">
          <h6 class="mb-0 fw-semibold"><i class="fa-solid fa-file-signature me-2"></i>Consentimento Informado</h6>
        </div>
        <div class="card-body" id="consentBody">
          <div class="text-muted small">A verificar…</div>
        </div>
      </div>

      <!-- Active Alerts -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-header bg-white border-bottom">
          <h6 class="mb-0 fw-semibold"><i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>Alertas Ativos</h6>
        </div>
        <div class="card-body p-0">
          <div id="patientAlertsContainer" class="p-3">
            <div class="text-muted small">A carregar…</div>
          </div>
        </div>
      </div>

      <!-- Active therapy -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom">
          <h6 class="mb-0 fw-semibold"><i class="fa-solid fa-pills text-warning me-2"></i>Terapêutica Ativa</h6>
        </div>
        <div class="card-body p-0">
          <div id="activeTherapyContainer" class="p-3">
            <div class="text-muted small">A carregar…</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Add Consulta -->
<div class="modal fade" id="modalConsulta" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fa-solid fa-stethoscope me-2"></i>Registar Consulta</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formConsulta">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Data da Consulta *</label>
              <input type="date" class="form-control" name="data_consulta" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo *</label>
              <select class="form-select" name="tipo_consulta" required>
                <option value="rotina">Rotina</option>
                <option value="urgencia">Urgência</option>
                <option value="gmnf">GMNF</option>
                <option value="seguimento">Seguimento</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Médico *</label>
              <input type="text" class="form-control" name="medico" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Especialidade</label>
              <input type="text" class="form-control" name="especialidade" />
            </div>
            <div class="col-12">
              <label class="form-label">Motivo</label>
              <input type="text" class="form-control" name="motivo" />
            </div>
            <div class="col-12">
              <label class="form-label">Resumo Clínico</label>
              <textarea class="form-control" name="resumo_clinica" rows="3"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Notas Clínicas (NLP)</label>
              <textarea class="form-control" name="notas_clinicas" rows="4" placeholder="Insira as notas clínicas — o sistema irá analisar automaticamente…"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Próxima Consulta</label>
              <input type="date" class="form-control" name="proxima_consulta" />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitConsulta()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Add Exame -->
<div class="modal fade" id="modalExame" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="fa-solid fa-microscope me-2"></i>Solicitar Exame</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formExame">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo de Exame *</label>
              <select class="form-select" name="tipo_exame" required>
                <option value="RM">RM</option>
                <option value="TC">TC</option>
                <option value="PET">PET</option>
                <option value="ecografia">Ecografia</option>
                <option value="analises">Análises</option>
                <option value="biopsia">Biópsia</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Subtipo</label>
              <input type="text" class="form-control" name="subtipo" placeholder="Ex: Crânio, Abdómen…" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Data de Solicitação *</label>
              <input type="date" class="form-control" name="data_solicitacao" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Solicitado Por</label>
              <input type="text" class="form-control" name="solicitado_por" />
            </div>
            <div class="col-12">
              <label class="form-label">Estado *</label>
              <select class="form-select" name="status" required>
                <option value="solicitado">Solicitado</option>
                <option value="agendado">Agendado</option>
                <option value="realizado">Realizado</option>
                <option value="resultado_disponivel">Resultado Disponível</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Observações</label>
              <textarea class="form-control" name="observacoes" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" onclick="submitExame()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Add GMNF -->
<div class="modal fade" id="modalGmnf" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-purple text-white" style="background-color:#6f42c1 !important;">
        <h5 class="modal-title"><i class="fa-solid fa-users me-2"></i>Decisão GMNF</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formGmnf">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Data da Reunião *</label>
              <input type="date" class="form-control" name="data_reuniao" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Nº Reunião</label>
              <input type="text" class="form-control" name="numero_reuniao" />
            </div>
            <div class="col-12">
              <label class="form-label">Tratamento Proposto</label>
              <input type="text" class="form-control" name="tratamento_proposto" />
            </div>
            <div class="col-12">
              <label class="form-label">Justificação</label>
              <textarea class="form-control" name="justificacao" rows="2"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Decisão *</label>
              <select class="form-select" name="decisao" required>
                <option value="aprovado">Aprovado</option>
                <option value="recusado">Recusado</option>
                <option value="pendente">Pendente</option>
                <option value="aguarda_exames">Aguarda Exames</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Médico Responsável</label>
              <input type="text" class="form-control" name="medico_responsavel" />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitGmnf()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Add Terapia -->
<div class="modal fade" id="modalTerapia" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title"><i class="fa-solid fa-pills me-2"></i>Registo Terapêutico (MEK)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formTerapia">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Fármaco *</label>
              <select class="form-select" name="farmaco" required>
                <option value="selumetinib">Selumetinib</option>
                <option value="trametinib">Trametinib</option>
                <option value="binimetinib">Binimetinib</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado *</label>
              <select class="form-select" name="status" required>
                <option value="aguarda_inicio">Aguarda Início</option>
                <option value="ativo">Ativo</option>
                <option value="suspenso">Suspenso</option>
                <option value="terminado">Terminado</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Data de Início *</label>
              <input type="date" class="form-control" name="data_inicio" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Data de Fim</label>
              <input type="date" class="form-control" name="data_fim" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Dose (mg)</label>
              <input type="number" step="0.1" class="form-control" name="dose_mg" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Frequência</label>
              <input type="text" class="form-control" name="frequencia" placeholder="Ex: 2x/dia" />
            </div>
            <div class="col-12">
              <label class="form-label">Indicação</label>
              <textarea class="form-control" name="indicacao" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-warning" onclick="submitTerapia()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/patient.js"></script>
</body>
</html>
